plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	mods {
		"apollowaypoints" {
			sourceSet sourceSets.main
		}
	}
}

// ./gradlew runClientGameTest: opens a client window, checks the Xaero adapter and takes screenshots
// (build/run/clientGameTest/screenshots). Needs a display.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "apollowaypoints-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	compileOnly "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
	gametestCompileOnly "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
	gametestRuntimeOnly "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
	gametestRuntimeOnly "maven.modrinth:xaeros-world-map:${project.xaero_world_map_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

test {
	useJUnitPlatform()
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
